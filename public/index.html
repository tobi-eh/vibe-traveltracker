<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Tracker</title>
    <link rel="stylesheet" href="styles.css">

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- D3.js and TopoJSON -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/topojson-client@3"></script>
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <header class="sidebar-header">
                <div class="logo">🌎</div>
                <h1>Travel Tracker</h1>
                <p>Mark the places you have visited to visualize them on the map.</p>
            </header>

            <div class="map-controls">
                <h2>Map Scope</h2>
                <div class="scope-toggle">
                    <button class="scope-btn active" data-scope="usa">USA (States)</button>
                    <button class="scope-btn" data-scope="world">World</button>
                    <button class="scope-btn" data-scope="europe">Europe</button>
                </div>
            </div>

            <div class="selection-container">
                <h2 id="selection-heading">🇺🇸 Select States & Territories Visited</h2>

                <div class="stats-card">
                    <p id="stats-text">You have visited <strong id="visited-count">0</strong> out of <span
                            id="total-count">56</span> states and territories (<span
                            id="visited-percentage">0.0%</span>).</p>
                </div>

                <!-- A searchable list of places will be dynamically injected here -->
                <div class="search-box">
                    <input type="text" id="place-search" placeholder="Search..." autocomplete="off">
                </div>
                <ul class="place-list" id="place-list">
                    <!-- List items generated by JS -->
                </ul>
            </div>
        </aside>

        <!-- Main Map Area -->
        <main class="map-area">
            <div id="tooltip" class="tooltip"></div>
            <div id="map-container">
                <!-- SVG map generated here by D3 -->
            </div>
        </main>
    </div>

    <!-- Main Logic -->
    <script src="app.js"></script>
</body>

</html>
